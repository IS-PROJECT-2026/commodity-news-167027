<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetroMarket News - Oil & Gas Spot Ticker (Edition A)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="ticker" id="market-ticker-data">
        <strong>MARKETS:</strong> Loading live commodity spot rates...
    </div>
    <header>
        <h1>PetroMarket Energy News</h1>
        <p>Real-time Intelligence on Oil, Gas, and Energy Commodities</p>
    </header>
    <main class="container">
        <section class="chart-container" style="background: var(--card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 2rem;">
            <h2>Energy Commodity Spot Trends (7-Day)</h2>
            <canvas id="commodityChart" height="100"></canvas>
        </section>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterNews('All')">All Markets</button>
            <button class="filter-btn" onclick="filterNews('Crude Oil')">Crude Oil</button>
            <button class="filter-btn" onclick="filterNews('Natural Gas')">Natural Gas</button>
            <button class="filter-btn" onclick="filterNews('LNG')">LNG</button>
            <button class="filter-btn" onclick="filterNews('Infrastructure')">Infrastructure</button>
        </div>
        
        <h2>Latest Energy Headlines</h2>
        <div id="news-grid" class="grid">
            <!-- Rendered dynamically via app.js -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
